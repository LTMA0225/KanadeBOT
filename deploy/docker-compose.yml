# 音游窝 QQ 机器人：AstrBot + NapCat Docker 编排（服务器部署用；Windows 桌面请用迁移包里的一键部署）

services:
  astrbot:
    build:
      context: .
      dockerfile: Dockerfile.astrbot
    image: dcs-astrbot:local
    container_name: dcs-astrbot
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:6185:6185"   # AstrBot 管理面板（仅宿主机本机可访问）
    volumes:
      - ./data:/AstrBot/data
      - ../:/AstrBot/data/plugins/astrbot_plugin_dcs_whosin:ro
    networks:
      - dcs-bot

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: dcs-napcat
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - NAPCAT_UID=1000
      - NAPCAT_GID=1000
    ports:
      - "127.0.0.1:6099:6099"   # NapCat WebUI（仅宿主机本机可访问）
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/qq:/app/.config/QQ
    networks:
      - dcs-bot

networks:
  dcs-bot:
    driver: bridge
